{% extends "base.html" %}

{% block title %}Delete Event — MUJVERSE Organizer{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 600px;">
  <div class="mv-card p-5 text-center">
    <i class="bi bi-trash3 fs-1 text-danger mb-3 d-block"></i>
    <h1 class="h3 fw-bold mb-2">Delete Event?</h1>
    <p class="text-muted mb-1">You are about to permanently delete:</p>
    <p class="fw-bold text-white fs-5 mb-4">{{ event.title }}</p>
    <p class="small text-danger mb-4">
      <i class="bi bi-exclamation-triangle me-1"></i>
      This action cannot be undone. All associated data will be removed.
    </p>
    <div class="d-flex gap-3 justify-content-center">
      <a href="{% url 'organizer:dashboard' %}" class="btn btn-mv-outline px-4">
        <i class="bi bi-arrow-left me-1"></i> Cancel
      </a>
      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger px-4">
          <i class="bi bi-trash me-1"></i> Yes, Delete Permanently
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
