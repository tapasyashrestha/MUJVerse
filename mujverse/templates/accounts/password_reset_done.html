{% extends "base.html" %}

{% block title %}Reset Link Sent — MUJVERSE{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-5 text-center">
      <div class="mv-card p-5">
        <i class="bi bi-envelope-check-fill fs-1 text-success mb-3"></i>
        <h2 class="h4 fw-bold">Check Your Email</h2>
        <p class="text-muted">
          If an account exists with the email entered, we've sent instructions for resetting your password.
        </p>
        <a href="{% url 'accounts:login' %}" class="btn btn-mv-outline mt-3">Return to Log In</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
