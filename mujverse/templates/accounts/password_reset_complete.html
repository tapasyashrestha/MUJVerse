{% extends "base.html" %}

{% block title %}Password Reset Complete — MUJVERSE{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-5 text-center">
      <div class="mv-card p-5">
        <i class="bi bi-shield-check fs-1 text-success mb-3"></i>
        <h2 class="h4 fw-bold">Password Reset Complete</h2>

        <a href="{% url 'accounts:login' %}" class="btn btn-mv-primary mt-3">Log In</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
