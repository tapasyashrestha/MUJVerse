{% extends "base.html" %}

{% block title %}Reset Password — MUJVERSE{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
      <div class="mv-card p-4 p-md-5">
        <div class="text-center mb-4">
          <i class="bi bi-key-fill fs-1 text-warning mb-2"></i>
          <h2 class="h4 fw-bold">Password Reset</h2>
          <p class="text-muted small">Enter your account email to receive a password recovery link.</p>
        </div>

        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label for="id_email" class="form-label">Email Address</label>
            <input type="email" name="email" id="id_email" class="form-control" placeholder="name@muj.manipal.edu" required>
          </div>
          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-mv-primary">Send Reset Link</button>
          </div>
          <div class="text-center mt-3">
            <a href="{% url 'accounts:login' %}" class="small text-muted">Back to Log In</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
